[package]
name = "dyno-server"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.5", features = ["derive"] }
dyno-backend = { version = "0.1.0", path = "../dyno-backend" }
dyno-cel = { version = "0.1.0", path = "../dyno-cel" }
dyno-config = { version = "0.1.0", path = "../dyno-config" }
dyno-core = { version = "0.1.0", path = "../dyno-core" }
futures-util = { version = "0.3.33", features = ["sink", "std"] }
ldap3_proto = "0.8.0"
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["full"] }
tokio-util = { version = "0.7.19", features = ["codec"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[lints]
workspace = true

[dev-dependencies]
ldap3 = { version = "0.12.1", default-features = false, features = ["tls-rustls-ring"] }
tempfile = "3.27.0"
